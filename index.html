<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ffb6c1, #ffc0cb, #ffe4e1);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #333;
        }

        /* Floating background hearts */
        .heart-bg {
            position: absolute;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.5);
            animation: float 6s linear infinite;
            z-index: 0;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
            z-index: 10;
            position: relative;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 30px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
        }

        button {
            font-family: 'Nunito', sans-serif;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .yes-btn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }

        .yes-btn:active {
            transform: scale(0.95);
        }

        .no-btn {
            background-color: #f8f9fa;
            color: #555;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            /* Transition for the smooth running away effect */
            transition: all 0.3s ease; 
        }

        .no-btn:active {
            transform: scale(0.95);
        }

        .progress {
            margin-top: 30px;
            font-size: 14px;
            color: #888;
        }

        /* Admin Panel Styles */
        #admin-panel {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 100;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }

        .admin-table th, .admin-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        .admin-table th {
            background-color: #ff4d6d;
            color: white;
        }

        /* Hidden trigger button */
        #secret-trigger {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            opacity: 0;
            z-index: 50;
        }
    </style>
</head>
<body>

    <!-- Floating Background Hearts -->
    <script>
        for(let i = 0; i < 15; i++) {
            let heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.className = 'heart-bg';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(heart);
        }
    </script>

    <div class="card" id="quiz-card">
        <h2 id="question-text">Loading...</h2>
        <div class="btn-container">
            <button class="yes-btn" onclick="answer('Yes')">Yes</button>
            <button class="no-btn" id="no-btn" onclick="answer('No')">No</button>
        </div>
        <div class="progress" id="progress-text">1 / 40</div>
    </div>

    <!-- Hidden element to trigger admin panel on mobile/desktop -->
    <div id="secret-trigger" onclick="checkAdmin()"></div>

    <!-- Admin Panel -->
    <div id="admin-panel">
        <h2 style="color: #ff4d6d;">Secret Answer Vault</h2>
        <button class="yes-btn" onclick="closeAdmin()">Close</button>
        <table class="admin-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Question</th>
                    <th>Answer</th>
                </tr>
            </thead>
            <tbody id="admin-body">
                <!-- Answers will populate here -->
            </tbody>
        </table>
    </div>

    <script>
        const questions = [
            "1. Do you think I'm the best boyfriend you've ever had?",
            "2. Do you trust me with your whole heart?",
            "3. Do you see us lasting a long time?",
            "4. Do you feel safe with me?",
            "5. Do you think I make you happy?",
            "6. Would you choose me all over again?",
            "7. Do you miss me when we're apart?",
            "8. Have I changed your life for the better?",
            "9. Do you think I understand you better than most people?",
            "10. Would you still love me even if life got really difficult?",
            "11. Have you ever blushed because of me?",
            "12. Do you get butterflies when I text you?",
            "13. Have you ever stared at my pictures for longer than you'd admit?",
            "14. Would you kiss me if we were together right now?",
            "15. Do you secretly love when I get clingy?",
            "16. Have you ever dreamed about me?",
            "17. Do you think I'm attractive?",
            "18. Would you cuddle with me all day if you could?",
            "19. Have I ever made your heart race?",
            "20. Would you be jealous if another girl flirted with me?",
            "21. Would you save your phone before me if both were falling? 💀",
            "22. If I lost all my hair, would you still find me attractive?",
            "23. Would you laugh if I tripped in public?",
            "24. If your favorite celebrity asked you out, would you say yes?",
            "25. Do you think you're always right?",
            "26. Would you steal my fries even if you said you weren't hungry?",
            "27. If we played Mario Kart, would you target me on purpose?",
            "28. Would you post an embarrassing picture of me for $1,000?",
            "29. Do you think you're funnier than me?",
            "30. If I lost every game we played for a year, would you still respect me? 😭",
            // The Next 10 (Trick Questions)
            "31. Do you love your boyfriend? ❤️",
            "32. Are you happy we're together?",
            "33. Do you think your boyfriend is cute?",
            "34. Are you proud to call him your boyfriend?",
            "35. Do you enjoy spending time with your boyfriend?",
            "36. Do you think your boyfriend makes you smile?",
            "37. Would you choose your boyfriend all over again?",
            "38. Do you think your boyfriend is special to you?",
            "39. Are you lucky to have your boyfriend? 😉",
            "40. Will you keep loving your boyfriend forever? ❤️"
        ];

        let currentIndex = 0;
        let savedAnswers = [];
        
        const questionText = document.getElementById('question-text');
        const progressText = document.getElementById('progress-text');
        const noBtn = document.getElementById('no-btn');
        const quizCard = document.getElementById('quiz-card');

        function loadQuestion() {
            if (currentIndex >= questions.length) {
                // Quiz Complete
                questionText.innerHTML = "Yay! Thank you for playing! I love you! ❤️";
                document.querySelector('.btn-container').style.display = 'none';
                progressText.innerHTML = "100% Complete";
                // Save to local storage for the admin panel
                localStorage.setItem('sudeepAnswers', JSON.stringify(savedAnswers));
                return;
            }

            questionText.innerText = questions[currentIndex];
            progressText.innerText = `${currentIndex + 1} / 40`;

            // Reset the 'No' button position every time a new question loads
            noBtn.style.position = 'static';
            noBtn.style.transform = 'translate(0, 0)';
        }

        function answer(response) {
            savedAnswers.push({
                q: questions[currentIndex],
                a: response
            });
            currentIndex++;
            loadQuestion();
        }

        // --- TRICK BUTTON LOGIC (Runs on questions 31-40) ---
        function moveButton(e) {
            // Arrays are 0-indexed, so 30 is question 31
            if (currentIndex >= 30) { 
                e.preventDefault(); // Stops her from clicking it on mobile
                
                // Calculate random positions within the window
                const x = Math.random() * (window.innerWidth - 100) - (window.innerWidth / 2 - 50);
                const y = Math.random() * (window.innerHeight - 100) - (window.innerHeight / 2 - 50);
                
                // Make the button jump around
                noBtn.style.position = 'absolute';
                noBtn.style.transform = `translate(${x}px, ${y}px)`;
            }
        }

        // Works for both computer mice and mobile phone tapping
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', moveButton);

        // --- ADMIN PANEL LOGIC ---
        function checkAdmin() {
            let code = prompt("Enter secret code:");
            if (code === "ils03") {
                document.getElementById('quiz-card').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                populateTable();
            }
        }

        function closeAdmin() {
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('quiz-card').style.display = 'block';
        }

        function populateTable() {
            const tbody = document.getElementById('admin-body');
            tbody.innerHTML = '';
            
            // Try to load saved answers, or use current session answers
            let answersToDisplay = savedAnswers.length > 0 ? savedAnswers : JSON.parse(localStorage.getItem('sudeepAnswers') || '[]');

            answersToDisplay.forEach((item, index) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.q.substring(item.q.indexOf('.') + 1).trim()}</td>
                    <td style="font-weight:bold; color: ${item.a === 'Yes' ? '#ff4d6d' : '#555'}">${item.a}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Listen for typing the code on a keyboard (if on a computer)
        let keys = "";
        document.addEventListener('keydown', (e) => {
            keys += e.key;
            if (keys.length > 5) keys = keys.slice(1);
            if (keys === "ils03") {
                document.getElementById('quiz-card').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                populateTable();
                keys = ""; // reset
            }
        });

        // Initialize first question
        loadQuestion();
    </script>
</body>
</html>

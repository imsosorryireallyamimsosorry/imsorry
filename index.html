<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Sudeep ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #4a4a4a;
        }

        /* Cute Floating Hearts Background */
        .heart-bg {
            position: absolute;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.6);
            animation: floatup linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes floatup {
            0% { transform: translateY(110vh) scale(0.8) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        /* Main Card Style */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 154, 158, 0.4);
            text-align: center;
            width: 90%;
            max-width: 380px;
            z-index: 10;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Menu Screen Specifics */
        #menu-screen h1 {
            font-size: 26px;
            color: #ff6b81;
            margin-bottom: 10px;
        }

        #menu-screen p {
            font-size: 16px;
            margin-bottom: 30px;
            color: #7a7a7a;
        }

        .heartbeat {
            font-size: 50px;
            animation: beat 1s infinite alternate;
            margin-bottom: 10px;
        }

        @keyframes beat {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        /* Quiz Screen Specifics */
        #quiz-screen {
            display: none;
            min-height: 250px;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 30px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
        }

        .fade-out {
            opacity: 0 !important;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            width: 100%;
            min-height: 50px;
        }

        button {
            font-family: 'Quicksand', sans-serif;
            font-size: 18px;
            font-weight: 700;
            padding: 12px 35px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            outline: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-btn {
            background: linear-gradient(45deg, #ff6b81, #ff4757);
            color: white;
            font-size: 20px;
            padding: 15px 50px;
            box-shadow: 0 8px 20px rgba(255, 107, 129, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 129, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 107, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 129, 0); }
        }

        .yes-btn {
            background-color: #ff4757;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            flex: 1;
        }

        .no-btn {
            background-color: #f1f2f6;
            color: #57606f;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            flex: 1;
            transition: top 0.3s ease, left 0.3s ease; /* Smooth running away */
        }

        button:active {
            transform: scale(0.92);
        }

        .progress {
            margin-top: 25px;
            font-size: 13px;
            color: #a4b0be;
            font-weight: bold;
        }

        /* End Screen Specifics */
        #end-screen {
            display: none;
            text-align: center;
        }
        
        #end-screen h1 {
            color: #ff4757;
            font-size: 28px;
            line-height: 1.4;
        }

        /* Admin Panel Styles */
        #admin-panel {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: white;
            z-index: 100;
            overflow-y: auto;
            padding: 20px;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }

        .admin-table th, .admin-table td {
            border: 1px solid #ffe4e1;
            padding: 10px;
            text-align: left;
        }

        .admin-table th {
            background-color: #ff6b81;
            color: white;
        }

        #secret-trigger {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 50px;
            height: 50px;
            opacity: 0;
            z-index: 50;
        }
    </style>
</head>
<body>

    <!-- Floating Background Hearts -->
    <script>
        const symbols = ['❤️', '✨', '💖', '🌸'];
        for(let i = 0; i < 20; i++) {
            let heart = document.createElement('div');
            heart.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            heart.className = 'heart-bg';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
            heart.style.animationDelay = (Math.random() * 5) + 's';
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            document.body.appendChild(heart);
        }
    </script>

    <!-- Menu Screen -->
    <div class="card" id="menu-screen">
        <div class="heartbeat">💌</div>
        <h1>For Sudeep</h1>
        <p>I made a little something for you...</p>
        <button class="start-btn" onclick="startQuiz()">Open</button>
    </div>

    <!-- Quiz Screen -->
    <div class="card" id="quiz-screen">
        <h2 id="question-text">Loading...</h2>
        <div class="btn-container" id="btn-container">
            <button class="yes-btn" onclick="answer('Yes')">Yes</button>
            <button class="no-btn" id="no-btn" onclick="answer('No')">No</button>
        </div>
        <div class="progress" id="progress-text">1 / 40</div>
    </div>

    <!-- End Screen -->
    <div class="card" id="end-screen">
        <div class="heartbeat">💖</div>
        <h1>I Love You<br>So Much Babe</h1>
        <p style="color: #7a7a7a; margin-top: 10px;">(You can close this now!)</p>
    </div>

    <!-- Hidden element to trigger admin panel on mobile/desktop -->
    <div id="secret-trigger" onclick="checkAdmin()"></div>

    <!-- Admin Panel -->
    <div id="admin-panel">
        <h2 style="color: #ff4757; text-align:center; margin-bottom: 10px;">Secret Answer Vault</h2>
        <button class="start-btn" style="padding: 10px 20px; font-size: 14px;" onclick="closeAdmin()">Close Vault</button>
        <table class="admin-table">
            <thead>
                <tr>
                    <th style="width: 10%;">#</th>
                    <th style="width: 70%;">Question</th>
                    <th style="width: 20%;">Answer</th>
                </tr>
            </thead>
            <tbody id="admin-body">
                <!-- Answers will populate here -->
            </tbody>
        </table>
    </div>

    <script>
        const questions = [
            "1. Do you think I'm the best boyfriend you've ever had?",
            "2. Do you trust me with your whole heart?",
            "3. Do you see us lasting a long time?",
            "4. Do you feel safe with me?",
            "5. Do you think I make you happy?",
            "6. Would you choose me all over again?",
            "7. Do you miss me when we're apart?",
            "8. Have I changed your life for the better?",
            "9. Do you think I understand you better than most people?",
            "10. Would you still love me even if life got really difficult?",
            "11. Have you ever blushed because of me?",
            "12. Do you get butterflies when I text you?",
            "13. Have you ever stared at my pictures for longer than you'd admit?",
            "14. Would you kiss me if we were together right now?",
            "15. Do you secretly love when I get clingy?",
            "16. Have you ever dreamed about me?",
            "17. Do you think I'm attractive?",
            "18. Would you cuddle with me all day if you could?",
            "19. Have I ever made your heart race?",
            "20. Would you be jealous if another girl flirted with me?",
            "21. Would you save your phone before me if both were falling? 💀",
            "22. If I lost all my hair, would you still find me attractive?",
            "23. Would you laugh if I tripped in public?",
            "24. If your favorite celebrity asked you out, would you say yes?",
            "25. Do you think you're always right?",
            "26. Would you steal my fries even if you said you weren't hungry?",
            "27. If we played Mario Kart, would you target me on purpose?",
            "28. Would you post an embarrassing picture of me for $1,000?",
            "29. Do you think you're funnier than me?",
            "30. If I lost every game we played for a year, would you still respect me? 😭",
            // The Next 10 (Trick Questions)
            "31. Do you love your boyfriend? ❤️",
            "32. Are you happy we're together?",
            "33. Do you think your boyfriend is cute?",
            "34. Are you proud to call him your boyfriend?",
            "35. Do you enjoy spending time with your boyfriend?",
            "36. Do you think your boyfriend makes you smile?",
            "37. Would you choose your boyfriend all over again?",
            "38. Do you think your boyfriend is special to you?",
            "39. Are you lucky to have your boyfriend? 😉",
            "40. Will you keep loving your boyfriend forever? ❤️"
        ];

        let currentIndex = 0;
        let savedAnswers = [];
        
        const questionText = document.getElementById('question-text');
        const progressText = document.getElementById('progress-text');
        const noBtn = document.getElementById('no-btn');
        const quizCard = document.getElementById('quiz-screen');

        function startQuiz() {
            document.getElementById('menu-screen').style.display = 'none';
            quizCard.style.display = 'flex';
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIndex >= questions.length) {
                // Quiz Complete
                quizCard.style.display = 'none';
                document.getElementById('end-screen').style.display = 'block';
                // Save to local storage for the admin panel
                localStorage.setItem('sudeepAnswers', JSON.stringify(savedAnswers));
                return;
            }

            // Fade animation
            questionText.style.opacity = 0;
            
            setTimeout(() => {
                questionText.innerText = questions[currentIndex];
                progressText.innerText = `${currentIndex + 1} / 40`;
                questionText.style.opacity = 1;
                
                // Reset the 'No' button position safely
                noBtn.style.position = 'static';
                noBtn.style.flex = '1';
                noBtn.style.left = 'auto';
                noBtn.style.top = 'auto';
            }, 300);
        }

        function answer(response) {
            savedAnswers.push({
                q: questions[currentIndex],
                a: response
            });
            currentIndex++;
            loadQuestion();
        }

        // --- MOBILE SAFE TRICK BUTTON LOGIC ---
        function moveButton(e) {
            if (currentIndex >= 30) { 
                e.preventDefault();
                
                // Switch to fixed positioning so it moves relative to the entire screen
                noBtn.style.position = 'fixed';
                noBtn.style.flex = 'none';
                
                const btnWidth = noBtn.offsetWidth || 100;
                const btnHeight = noBtn.offsetHeight || 50;
                
                // Calculate maximum bounds so the button never leaves the screen
                const maxX = window.innerWidth - btnWidth - 20;
                const maxY = window.innerHeight - btnHeight - 20;
                
                // Generate a random position within bounds
                const randomX = Math.max(10, Math.floor(Math.random() * maxX));
                const randomY = Math.max(10, Math.floor(Math.random() * maxY));
                
                noBtn.style.left = randomX + 'px';
                noBtn.style.top = randomY + 'px';
            }
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', moveButton);

        // --- ADMIN PANEL LOGIC ---
        function checkAdmin() {
            let code = prompt("Admin Panel Code:");
            if (code === "ils03") {
                document.getElementById('menu-screen').style.display = 'none';
                document.getElementById('quiz-screen').style.display = 'none';
                document.getElementById('end-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                populateTable();
            }
        }

        function closeAdmin() {
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'flex';
        }

        function populateTable() {
            const tbody = document.getElementById('admin-body');
            tbody.innerHTML = '';
            
            let answersToDisplay = savedAnswers.length > 0 ? savedAnswers : JSON.parse(localStorage.getItem('sudeepAnswers') || '[]');

            answersToDisplay.forEach((item, index) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.q.substring(item.q.indexOf('.') + 1).trim()}</td>
                    <td style="font-weight:bold; color: ${item.a === 'Yes' ? '#ff4757' : '#57606f'}">${item.a}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Secret keyboard listener for PC
        let keys = "";
        document.addEventListener('keydown', (e) => {
            keys += e.key;
            if (keys.length > 5) keys = keys.slice(1);
            if (keys === "ils03") {
                document.getElementById('menu-screen').style.display = 'none';
                document.getElementById('quiz-screen').style.display = 'none';
                document.getElementById('end-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                populateTable();
                keys = ""; 
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This meta tag is crucial for fitting everything onto a mobile screen perfectly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For You</title>
    <style>
        /* Smooth, animated pastel background */
        body {
            background: linear-gradient(-45deg, #ffb6c1, #ffc0cb, #ffe4e1, #fff0f5);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            color: #6a4a52; /* Soft deep pink-brown */
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Glassmorphism cute panels - Adjusted for Mobile */
        .screen {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(255, 182, 193, 0.4);
            width: 85%;
            max-width: 400px;
            max-height: 85vh; /* Prevents the box from going off-screen vertically */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-sizing: border-box;
        }
        
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 700;
            color: #ec8b9e;
        }
        
        /* Bouncy, beautiful buttons */
        button {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            border: none;
            border-radius: 30px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            color: #6a4a52;
            cursor: pointer;
            margin: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(255, 154, 158, 0.4);
            width: 100%;
            max-width: 200px;
        }
        
        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 20px rgba(255, 154, 158, 0.6);
            color: #fff;
        }

        button:active {
            transform: translateY(0px) scale(0.95);
        }

        /* Container to center the typewriter properly */
        #typewriter-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Typewriter area - Optimized for Mobile Scrolling */
        #typewriter-text {
            font-size: 15px; /* Slightly smaller for mobile readability */
            line-height: 1.6;
            height: 55vh; /* Locks the height so it doesn't push buttons off screen */
            width: 100%;
            margin-bottom: 15px;
            text-align: left;
            border-left: 4px solid #ff9a9e;
            padding-left: 12px;
            padding-right: 5px;
            overflow-y: auto; /* Enables scrolling */
            scroll-behavior: smooth;
            box-sizing: border-box;
        }

        /* Custom cute pink scrollbar */
        #typewriter-text::-webkit-scrollbar {
            width: 6px;
        }
        #typewriter-text::-webkit-scrollbar-track {
            background: #ffe4e1;
            border-radius: 10px;
        }
        #typewriter-text::-webkit-scrollbar-thumb {
            background: #ffb6c1;
            border-radius: 10px;
        }

        /* Heart styling for the end */
        .heart {
            font-size: 50px;
            animation: heartbeat 1.5s infinite;
            display: inline-block;
            margin-top: 10px;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.2); }
            60% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Screen 1: The Menu -->
    <div id="screen1" class="screen" style="display: flex;">
        <h1>I'm so sorry 🥺</h1>
        <button onclick="switchScreen('screen1', 'screen2')">Open</button>
    </div>

    <!-- Screen 2: The Question -->
    <div id="screen2" class="screen" style="display: none;">
        <h1>Are u hurt?</h1>
        <button onclick="startApology()">Yes</button>
        <button onclick="startApology()">No</button>
    </div>

    <!-- Screen 3: The Typewriter Apology -->
    <div id="screen3" class="screen" style="display: none;">
        <div id="typewriter-container">
            <div id="typewriter-text"></div>
            <button id="next-btn" style="display: none;" onclick="switchScreen('screen3', 'screen4')">Next</button>
        </div>
    </div>

    <!-- Screen 4: The Final Message -->
    <div id="screen4" class="screen" style="display: none;">
        <h1>I'm sorry I hurt you</h1>
        <div class="heart">❤️</div>
    </div>

    <script>
        const apologyText = `Hi Sudeep.

I made this because a simple "I'm sorry" didn't feel like enough.

I know I hurt you, and I take full responsibility for it. A couple of months ago I said things about you that I never should have said. I judged you unfairly and repeated something hurtful because of assumptions I made. Looking back, I hate that I ever spoke about you that way.

As I got to know you, I realized how wrong I was. You're genuinely kind, caring, and nothing like the picture I had created in my head. That doesn't change what I said, and I'm not using it as an excuse. I just want you to know that I recognize how unfair I was.

You deserved respect from the beginning, even before I knew you well, and I failed to give you that.

I understand if this changed the way you see me. Trust isn't rebuilt because of one apology or one website. It's rebuilt by consistently being honest, respectful, and proving through my actions that I've changed. That's what I want to do.

We've only been together for a short time, but these past few days have made me realize how much I care about you. I don't want to be someone who hurts the person he cares about.

Thank you for reading this. Whether it takes time or not, I hope I can earn back your trust.

I'm truly sorry and i love you. ❤️`;

        // Direct style switching for guaranteed functionality
        function switchScreen(hideId, showId) {
            document.getElementById(hideId).style.display = 'none';
            document.getElementById(showId).style.display = 'flex';
        }

        // Move to screen 3 and start typing
        function startApology() {
            switchScreen('screen2', 'screen3');
            typeWriter();
        }

        // Typewriter logic with auto-scroll
        let i = 0;
        const typingSpeed = 40; 
        const textBox = document.getElementById("typewriter-text");

        function typeWriter() {
            if (i < apologyText.length) {
                let char = apologyText.charAt(i);
                
                if (char === '\n') {
                    textBox.innerHTML += "<br>";
                } else {
                    textBox.innerHTML += char;
                }
                
                // This line automatically scrolls the box to the bottom as it types!
                textBox.scrollTop = textBox.scrollHeight;
                
                i++;
                setTimeout(typeWriter, typingSpeed);
            } else {
                // Show the Next button when finished typing and scroll one last time
                document.getElementById("next-btn").style.display = "inline-block";
                textBox.scrollTop = textBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
